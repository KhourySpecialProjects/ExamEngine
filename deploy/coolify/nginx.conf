events {
    worker_connections 1024;
}

http {
    # ExamEngine single-domain reverse proxy for the Coolify dev deployment.
    #   /api/*  -> backend  (prefix PRESERVED; the FastAPI app mounts routes under /api)
    #   /*      -> frontend (Next.js)
    # This mirrors the AWS ALB routing and keeps the browser same-origin (no CORS).

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # Dataset CSV uploads can be large (matches the old dev nginx limit).
        client_max_body_size 100M;

        # Proxy-local health endpoint for Coolify/Docker checks (does not touch upstreams).
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Backend API. No trailing slash on proxy_pass => original URI (incl. /api) is preserved.
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else -> frontend.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
